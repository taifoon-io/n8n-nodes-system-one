# Every push and pull request: the same gates n8n's verification applies, before anything can be released.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Lint with n8n's community-node ruleset (strict mode, nothing turned off)
        run: npm run lint
      - run: npm run build
      - name: Offline tests: the request on every host, the answers, errors, retries (a fake host)
        run: npm test
      - name: n8n's community-package scanner on the source and the packed tarball
        run: npm run scan
      - name: The author email is a real mailbox (n8n sends its ownership token there; a noreply address receives nothing)
        run: node -e "const e=(require('./package.json').author||{}).email||''; if(!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(e)||/noreply/i.test(e)){console.error('author.email must be a reachable mailbox, got:',e); process.exit(1)}"
      - name: No run-time dependencies (n8n's rule for verified community nodes)
        run: node -e "const d=Object.keys(require('./package.json').dependencies||{}); if(d.length){console.error('run-time dependencies:',d); process.exit(1)}"
      - name: Strict mode is on
        run: node -e "if(require('./package.json').n8n.strict!==true){console.error('n8n.strict must be true'); process.exit(1)}"
      - name: The node reads no environment and no file system
        run: "! grep -rnE 'process\\.env|require\\([\"'\\'']fs[\"'\\'']\\)|from [\"'\\'']fs[\"'\\'']|node:fs|child_process' nodes credentials --include=*.ts"
